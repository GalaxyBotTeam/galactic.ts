name: Release
on:
  release:
    # `released` does not fire for pre-releases and `published` would fire twice for a stable one.
    types: [released, prereleased]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Set package version
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version

      - run: npm ci
      - run: npm run build

      - name: Publish to npm via Trusted Publishing
        # Pre-releases go to `next`, so a plain `npm install galactic.ts` keeps resolving to stable.
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
